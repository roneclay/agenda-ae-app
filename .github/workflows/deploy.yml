name: Deploy
on:
  push:
    branches: [staging, main]

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    env:
      WEBHOOK: ${{ secrets.COOLIFY_STAGING_WEBHOOK }}
    steps:
      - name: Trigger Coolify — Staging
        if: ${{ env.WEBHOOK != '' }}
        run: curl --silent --fail -X GET "$WEBHOOK"

  deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      WEBHOOK: ${{ secrets.COOLIFY_PRODUCTION_WEBHOOK }}
    steps:
      - name: Trigger Coolify — Produção
        if: ${{ env.WEBHOOK != '' }}
        run: curl --silent --fail -X GET "$WEBHOOK"
